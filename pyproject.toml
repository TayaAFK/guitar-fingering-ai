[project]
name = "guitar-ai"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "basic-pitch[onnx]>=0.4.0",
    "fastapi>=0.156.4",
    "numpy<2",
    "onnx>=1.19.0",
    "python-multipart>=0.0.32",
    "setuptools<82",
    "uvicorn>=0.54.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
